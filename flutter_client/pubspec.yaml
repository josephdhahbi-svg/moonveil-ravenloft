name: moonveil_client
description: Offline-first Moonveil campaign storage
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  http: ^1.3.0
  cryptography: ^2.7.0
dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6
  test: ^1.25.0
flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/images/portraits/
    - assets/images/panels/
    - assets/images/backgrounds/
    - assets/images/items/
    - assets/images/creatures/
    - assets/images/props/
