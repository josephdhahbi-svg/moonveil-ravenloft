<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonveil — Ravenloft Playable Chapter</title><style>
:root{color-scheme:dark;font-family:system-ui;background:#100d1a;color:#eee5f5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#32223e,#100d1a 65%)}main{max-width:850px;margin:auto;padding:20px}h1{font:clamp(30px,6vw,54px) Georgia,serif;color:#ead6aa;margin-bottom:4px}h2{color:#d9bcf4}p{line-height:1.65}.muted{color:#c3b5cf}.box{border:1px solid #6d547d;background:#20172bde;border-radius:16px;padding:20px;margin:14px 0}.stats,.actions{display:flex;flex-wrap:wrap;gap:10px}.stat{background:#342441;border-radius:10px;padding:10px 15px}button{background:#65447e;border:1px solid #b39ac8;color:white;padding:13px 16px;border-radius:10px;font:inherit;cursor:pointer;min-height:44px}button:hover{background:#80609c}button:disabled{opacity:.45;cursor:default}.actions button{flex:1 1 220px;text-align:left}#log{max-height:220px;overflow:auto;font-size:14px}#log p{margin:6px 0}.tools{display:flex;flex-wrap:wrap;gap:8px}#notice{min-height:24px;color:#ead6aa}small{color:#bdb0cb}
</style></head><body><main><h1>MOONVEIL</h1><p class="muted">Ravenloft: The Horrors Within · Interactive Gothic Adventure</p><div class="stats" id="stats"></div><section class="box"><h2 id="scene"></h2><p id="story"></p><div id="actions" class="actions"></div></section><section class="box"><h2>Adventure Journal</h2><div id="log" aria-live="polite"></div></section><div class="tools"><button id="speak">Narrate scene</button><button id="stop">Stop voice</button><button id="save">Export game</button><label><button id="importButton" type="button">Import game</button><input id="import" type="file" accept=".json,application/json" hidden></label><button id="restart">New adventure</button></div><p id="notice" role="status"></p><small>Offline single-player chapter. Choices, combat, inventory and journal work locally. No online AI Dungeon Master is connected.</small></main><script>
(()=>{'use strict';
const fresh=()=>({hp:10,maxHp:10,ac:13,slot:1,scene:'gate',silver:false,key:false,ward:false,enemy:0,turn:0,log:['The Mists close behind you.'],xp:0,gold:0,clues:0});
let s=fresh();const $=id=>document.getElementById(id);const add=t=>{s.log.push(t);if(s.log.length>100)s.log.shift()};const roll=n=>1+Math.floor(Math.random()*n);
const scenes={
gate:{title:'The Gates of Barovia',text:'Rain beads on the iron gates. A bell tolls from an abandoned chapel. A pale raven watches from the crossroads.',choices:[['Approach the chapel','chapel'],['Follow the raven into the forest','forest'],['Investigate the village noticeboard','noticeboard'],['Inspect the roadside shrine','shrine']]},
noticeboard:{title:'The Village Noticeboard',text:'Three villagers are missing. A charcoal sketch shows a watchtower, and a message warns of unnatural footsteps after dusk.',choices:[['Study the missing-person notices',()=>{if(!(s.clues>0)){s.clues=1;add('You discovered a clue: the missing villagers were last seen near the watchtower.')}s.scene='noticeboard'}],['Return to the crossroads','gate']]},shrine:{title:'The Forgotten Shrine',text:'A cracked lunar symbol glimmers beneath the ivy. A small silver charm lies in the ash.',choices:[['Take the silver charm',()=>{if(!s.silver){s.silver=true;add('Recovered a silver charm.')}s.scene='gate'}],['Return to the crossroads','gate']]},
forest:{title:'The Whispering Forest',text:'A corpse-cold wind bends the trees. A skeletal sentinel rises from the mud, blocking a ruined watchtower.',choices:[['Fight the sentinel',()=>{s.enemy=9;s.turn=0;s.scene='combat'}],['Retreat to the crossroads','gate']]},
chapel:{title:'The Abandoned Chapel',text:'Candles burn without flame. The crypt door is locked. A spectral voice whispers: “The silver moon remembers.”',choices:[['Search the pews',()=>{if(!s.key){s.key=true;add('Found the crypt key under a pew.')}s.scene='chapel'}],['Open the crypt door',()=>{if(s.key){s.scene='crypt';add('Unlocked the crypt door.')}else add('The crypt is locked. Search for a key.')}],['Return to the crossroads','gate']]},
crypt:{title:'The Moonlit Crypt',text:'A blue light gathers over an ancient stone altar. The chapel is haunted, but the altar offers a chance to protect the road ahead.',choices:[['Consecrate the altar',()=>{if(!s.ward){s.ward=true;s.xp=(s.xp||0)+100;add('The lunar ward is restored. You gain 100 XP. The road is safer.')}s.scene='ending'}],['Return upstairs','chapel']]},
ending:{title:'Chapter Complete — A Light in the Mists',text:'The chapel bell rings clearly for the first time in years. Your actions have opened a fragile refuge in Barovia. This chapter is complete.',choices:[['Explore the crossroads again','gate']]}
};
function choice(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(typeof fn==='string')s.scene=fn;else fn();render()};$('actions').append(b)}
function fight(action){if(action==='spell'){if(!s.slot){add('No pact slot remains.');return} s.slot--;let dmg=roll(8)+2;s.enemy-=dmg;add('Your pact magic strikes for '+dmg+' damage.')}else if(action==='blast'){let hit=roll(20)+4;if(hit>=12){let dmg=roll(10);s.enemy-=dmg;add('Eldritch Blast hits for '+dmg+'.')}else add('Eldritch Blast misses.')}else if(action==='charm'&&s.silver){s.enemy-=5;add('The silver charm burns the sentinel for 5 damage.');s.silver=false}else if(action==='flee'){s.scene='forest';s.enemy=0;add('You escaped into the trees.');render();return}
if(s.enemy<=0){s.enemy=0;s.scene='forest';s.xp=(s.xp||0)+50;s.gold=(s.gold||0)+7;add('The skeletal sentinel collapses. You gain 50 XP and 7 gold. The watchtower path is clear.');render();return}
let attack=roll(20)+3;if(attack>=s.ac){let dmg=roll(4)+1;s.hp=Math.max(0,s.hp-dmg);add('Sentinel hits for '+dmg+' damage.')}else add('Sentinel misses.');if(s.hp===0){s.scene='fallen';add('The Mists swallow your last breath.')}render()}
function render(){$('stats').replaceChildren();[['HP',s.hp+'/'+s.maxHp],['AC',s.ac],['Pact slot',s.slot+'/1'],['Silver charm',s.silver?'Yes':'No'],['Crypt key',s.key?'Yes':'No'],['Lunar ward',s.ward?'Restored':'Dormant'],['XP',s.xp||0],['Gold',s.gold||0],['Clues',s.clues||0]].forEach(([k,v])=>{let d=document.createElement('div');d.className='stat';d.textContent=k+': '+v;$('stats').append(d)});$('actions').replaceChildren();if(s.scene==='combat'){$('scene').textContent='Combat — Skeletal Sentinel';$('story').textContent='Sentinel HP: '+s.enemy+'. Choose an action. Attack rolls and damage are rolled in the browser.';choice('Eldritch Blast',()=>fight('blast'));choice('Pact magic (1 slot)',()=>fight('spell'));if(s.silver)choice('Use silver charm',()=>fight('charm'));choice('Retreat',()=>fight('flee'))}else if(s.scene==='fallen'){$('scene').textContent='Lost in the Mists';$('story').textContent='Your journey ends here, but a new adventure can begin.';choice('Start a new adventure',()=>{s=fresh()})}else{const a=scenes[s.scene]||scenes.gate;$('scene').textContent=a.title;$('story').textContent=a.text;a.choices.forEach(c=>choice(c[0],c[1]))}const log=$('log');log.replaceChildren();s.log.slice(-18).forEach(t=>{const p=document.createElement('p');p.textContent='• '+t;log.append(p)});log.scrollTop=log.scrollHeight}
$('speak').onclick=()=>{if(!('speechSynthesis'in window)){$('notice').textContent='Speech synthesis is unavailable in this browser.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('scene').textContent+'. '+$('story').textContent);u.rate=.88;speechSynthesis.speak(u)};
$('stop').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel()};
$('save').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,state:s},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moonveil-adventure.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);$('notice').textContent='Adventure exported.'};
$('importButton').onclick=()=>$('import').click();$('import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text()),v=data.state;if(data.version!==1||!v||!Array.isArray(v.log)||typeof v.hp!=='number'||!['gate','noticeboard','shrine','forest','chapel','crypt','ending','combat','fallen'].includes(v.scene))throw Error('Invalid game file');s={...fresh(),...v,hp:Math.max(0,Math.min(10,v.hp)),slot:v.slot?1:0,log:v.log.slice(-100).map(String)};render();$('notice').textContent='Adventure imported.'}catch{$('notice').textContent='Could not import this game file.'}e.target.value=''};
$('restart').onclick=()=>{s=fresh();render();$('notice').textContent='New adventure started.'};render();
})();
</script></body></html>
