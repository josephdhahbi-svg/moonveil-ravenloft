name: Moonveil Development Web Preview

# Builds a downloadable preview artifact. Never publishes GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/copy-first-audit
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: flutter_client
        run: flutter pub get
      - name: Verify tests
        working-directory: flutter_client
        run: flutter test
      - name: Build web preview
        working-directory: flutter_client
        run: flutter build web --release --base-href /moonveil-preview/
      - name: Package preview
        run: tar -czf moonveil-preview-web.tar.gz -C flutter_client/build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: moonveil-preview-web
          path: moonveil-preview-web.tar.gz
          retention-days: 7
