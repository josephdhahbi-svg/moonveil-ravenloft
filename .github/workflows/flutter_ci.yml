name: Moonveil Flutter checks
on:
  push:
    branches:
      - 'integration/**'
  pull_request:
    branches:
      - main
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_client
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Test project memory and task robot
        run: python -m unittest scripts/test_moonveil_project_memory.py scripts/test_seed_moonveil_project_memory.py scripts/test_moonveil_art_robot.py
        working-directory: .
      - name: Test offline artwork installer
        run: python ../scripts/test_install_archive_art.py
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Generate missing Flutter web platform files
        run: flutter create . --platforms web
      - name: Build web without deployment
        run: flutter build web --release --base-href "/moonveil-ravenloft/"
