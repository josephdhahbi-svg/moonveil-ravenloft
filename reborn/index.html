<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonveil: Ravenloft Reborn</title><style>body{margin:0;background:#0b0b19;color:#eee4f6;font:16px system-ui}main{max-width:950px;margin:auto;padding:22px}header{padding:28px;background:linear-gradient(120deg,#34204c,#111428);border-radius:16px}h1{color:#e9c8ff}.panel{background:#19172a;border:1px solid #655178;border-radius:12px;padding:18px;margin:15px 0}button{background:#45315d;color:white;border:1px solid #b99bce;border-radius:8px;padding:12px;margin:5px;cursor:pointer}button:hover{background:#71518e}#map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:450px}#map div{aspect-ratio:1;background:#30263c;display:grid;place-items:center;border-radius:5px}#map .hero{background:#7654a2}#map .enemy{background:#8b3548}#log{white-space:pre-line;max-height:260px;overflow:auto}small{color:#bcb0cb}</style><main><header><h1>☾ Moonveil: Ravenloft Reborn</h1><p>Vesper Vane · Dhampir · Undead Warlock · Patron: Archlich of Mystra</p></header><section class="panel"><strong id="stats"></strong><p id="scene"></p><div id="actions"></div></section><section class="panel"><h2>Cathedral Battle Map</h2><div id="map"></div><p><button onclick="move(-1,0)">←</button><button onclick="move(0,-1)">↑</button><button onclick="move(0,1)">↓</button><button onclick="move(1,0)">→</button><button onclick="blast()">Eldritch Blast</button><button onclick="rest()">Rest</button></p><small>Move across the map. The red tile is a hostile shadow. Eldritch Blast works within three squares.</small></section><section class="panel"><h2>Journal</h2><div id="log"></div><button onclick="save()">Save</button><button onclick="reset()">New Game</button></section></main><script>const key='moonveil-reborn-v1';let s;function fresh(){return {hp:10,max:10,ac:13,slot:1,level:1,x:0,y:4,ex:4,ey:0,enemy:8,stage:0,turn:0,notes:['Vesper awakens in a moonlit Ravenloft cathedral.']}}function load(){try{s=JSON.parse(localStorage.getItem(key))||fresh()}catch(e){s=fresh()}render()}function save(){localStorage.setItem(key,JSON.stringify(s));render()}function note(t){s.notes.unshift(t);save()}function reset(){if(confirm('Start a new adventure? Your current save will be replaced.')){s=fresh();save()}}function roll(n){return Math.floor(Math.random()*n)+1}function dist(){return Math.abs(s.x-s.ex)+Math.abs(s.y-s.ey)}function move(dx,dy){s.x=Math.max(0,Math.min(4,s.x+dx));s.y=Math.max(0,Math.min(4,s.y+dy));s.turn++;if(s.enemy>0&&dist()<=1){let dmg=roll(4);s.hp=Math.max(0,s.hp-dmg);s.notes.unshift('The shadow strikes for '+dmg+' damage.')}if(s.hp===0){s.notes.unshift('Vesper falls. Rest to return to the cathedral threshold.')}save()}function blast(){if(s.hp===0)return note('You must recover first.');if(s.enemy<=0)return note('There is no shadow left to strike.');if(dist()>3)return note('The shadow is out of range. Move closer.');let hit=roll(20)+4;if(hit>=12){let dmg=roll(10);s.enemy=Math.max(0,s.enemy-dmg);s.notes.unshift('Eldritch Blast hits for '+dmg+' force damage!'+(s.enemy===0?' The shadow dissolves.':''))}else s.notes.unshift('Eldritch Blast misses ('+hit+').');s.turn++;save()}function rest(){s.hp=10;s.slot=1;if(s.hp===0){s.x=0;s.y=4}note('Vesper rests beneath the moon. HP and pact magic restored.')}function choice(i){if(s.stage!==0)return;let names=['The silver door opens onto a corridor of impossible stars.','Beneath the stairs, a sealed Netherese archive hums.','The kneeling woman whispers: The Weave is bleeding.','The coffin opens; an ancient shadow rises.'];s.stage=i+1;s.notes.unshift(names[i]);if(i===3){s.ex=3;s.ey=3}save()}function render(){document.getElementById('stats').textContent='Level '+s.level+' | HP '+s.hp+'/'+s.max+' | AC '+s.ac+' | Pact slots '+s.slot+'/1 | Shadow HP '+s.enemy;document.getElementById('scene').textContent=s.stage===0?'Moonlight spills through shattered stained glass. A silver door, a descending staircase, a mysterious woman, and a restless coffin await.':s.notes.find(t=>t.includes('opens')||t.includes('archive')||t.includes('whispers')||t.includes('coffin'))||'The cathedral waits for your next move.';document.getElementById('actions').innerHTML=s.stage===0?['Open the silver door','Descend into the archive','Speak to the woman','Investigate the coffin'].map((t,i)=>'<button onclick="choice('+i+')">'+t+'</button>').join(''):'<small>Explore the battle map, fight the shadow, or rest. Your progress saves automatically.</small>';let m='';for(let y=0;y<5;y++)for(let x=0;x<5;x++){let hero=x===s.x&&y===s.y,enemy=s.enemy>0&&x===s.ex&&y===s.ey;m+='<div class="'+(hero?'hero':enemy?'enemy':'')+'">'+(hero?'☾':enemy?'☠':'·')+'</div>'}document.getElementById('map').innerHTML=m;document.getElementById('log').textContent=s.notes.slice(0,16).join('\n\n')}load()</script></html>
